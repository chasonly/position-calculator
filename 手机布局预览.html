<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>仓位计算器 · 手机布局预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8edf4;color:#182b43;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{text-align:center;padding:20px 12px 16px}h1{font-size:17px;margin:0 0 10px}nav{display:flex;gap:8px;justify-content:center}button{font:inherit;font-size:12px;cursor:pointer;border:1px solid #cdd7e6;border-radius:8px;background:white;color:#63718a;padding:7px 12px}button[aria-pressed=true]{background:#245fde;border-color:#245fde;color:white}.device{width:390px;height:min(844px,calc(100dvh - 120px));margin:0 auto 20px;border:6px solid #22334d;border-radius:26px;overflow:hidden;box-shadow:0 16px 50px #182b4325;background:#f3f5f8;box-sizing:content-box;max-width:calc(100vw - 28px)}iframe{display:block;width:100%;height:100%;border:0}button:focus-visible{outline:3px solid #99b9ff;outline-offset:3px}@media(max-width:460px){header{padding:12px}.device{border:0;border-radius:0;width:100%!important;max-width:100%;height:calc(100dvh - 100px);margin:0}nav{display:none}}</style></head>
<body><header><h1>手机布局预览</h1><nav aria-label="预览屏幕宽度"><button data-width="360" aria-pressed="false">小屏 360</button><button data-width="390" aria-pressed="true">标准 390</button><button data-width="430" aria-pressed="false">大屏 430</button></nav></header><div class="device" id="device"><iframe src="股票与期货仓位计算器.html" title="仓位计算器，可直接修改参数和切换市场"></iframe></div><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('device').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></body></html>
